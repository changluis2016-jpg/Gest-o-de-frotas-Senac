<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Frota - Senac MT</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-800 p-2 rounded-lg font-bold text-xl tracking-wider">Senac MT</div>
                <div>
                    <h1 class="text-xl font-bold">Gestão e Agendamento de Frota</h1>
                    <p class="text-xs text-blue-200">Painel de Disponibilidade em Tempo Real</p>
                </div>
            </div>
            <div class="mt-3 sm:mt-0 flex items-center space-x-4">
                <div id="status-sinc" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full flex items-center space-x-1.5 border border-blue-700">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <span id="txt-atualizacao">Sincronizado com SharePoint</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">

        <!-- Controls: Date Filter & Search -->
        <div class="bg-white rounded-xl shadow-sm p-5 mb-8 border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="w-full md:w-auto flex flex-col sm:flex-row items-center gap-3">
                <label for="filtro-data" class="font-semibold text-sm text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Data Selecionada:
                </label>
                <input type="date" id="filtro-data" class="bg-gray-50 border border-gray-300 text-gray-950 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 font-medium">
            </div>
            <div class="w-full md:w-72">
                <input type="text" id="busca-geral" placeholder="Pesquisar motorista, veículo..." class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>

        <!-- Fleet Status Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path></svg>
                Status da Frota (3 Veículos Oficiais)
            </h2>
            <div id="grid-veiculos" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>

        <!-- Detailed Bookings Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    Agendamentos do Dia
                </h2>
                <span id="contador-agendamentos" class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">0 agendamento(s)</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 uppercase text-xs tracking-wider border-b border-gray-100">
                            <th class="py-3.5 px-6 font-semibold">Data</th>
                            <th class="py-3.5 px-6 font-semibold">Veículo</th>
                            <th class="py-3.5 px-6 font-semibold">Motorista / Solicitante</th>
                            <th class="py-3.5 px-6 font-semibold">Início</th>
                            <th class="py-3.5 px-6 font-semibold">Fim</th>
                            <th class="py-3.5 px-6 font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-agendamentos" class="divide-y divide-gray-100 text-sm">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-4 text-center text-xs text-gray-500">
        Senac MT — Sistema Integrado de Gestão de Frotas &copy; 2026
    </footer>

    <!-- Script de Processamento -->
    <script>
        const FROTA_OFICIAL = ["ONIX-7B64", "ONIX-3G84", "L200"];
        let dadosGlobais = [];

        // Definir a data de hoje como padrão no formato YYYY-MM-DD
        const hojeStr = new Date().toISOString().split('T')[0];
        const inputData = document.getElementById('filtro-data');
        if (inputData) inputData.value = hojeStr;

        // Carregar dados do data.json
        async function carregarDados() {
            try {
                const resposta = await fetch('data.json?' + new Date().getTime());
                if (!resposta.ok) throw new Error('Erro ao carregar dados');
                const json = await resposta.json();
                
                if (Array.isArray(json)) {
                    dadosGlobais = json;
                } else if (json.veiculos && Array.isArray(json.veiculos)) {
                    dadosGlobais = json.veiculos;
                } else {
                    dadosGlobais = [];
                }
                
                atualizarPainel();
            } catch (erro) {
                console.error("Erro:", erro);
                const txtAtualizacao = document.getElementById('txt-atualizacao');
                if (txtAtualizacao) txtAtualizacao.innerText = "Erro ao sincronizar dados";
            }
        }

        function normalizarTexto(txt) {
            if (!txt) return "";
            return String(txt).trim().toUpperCase();
        }

        // CORREÇÃO CRUCIAL DA DATA: Extrai estritamente os primeiros 10 carateres (YYYY-MM-DD) sem conversão de fuso horário
        function normalizarDataParaIso(dataBruta) {
            if (dataBruta === null || dataBruta === undefined || dataBruta === "") return "";
            let str = String(dataBruta).trim();

            if (str.includes('T')) {
                return str.substring(0, 10);
            }

            if (str.includes('/') || (str.includes('-') && str.indexOf('-') === 2)) {
                const separador = str.includes('/') ? '/' : '-';
                const partes = str.split(separador);
                if (partes.length === 3) {
                    let dia = partes[0].padStart(2, '0');
                    let mes = partes[1].padStart(2, '0');
                    let ano = partes[2];
                    if (ano.length === 2) ano = '20' + ano;
                    return `${ano}-${mes}-${dia}`;
                }
            }

            return str.substring(0, 10);
        }

        function formatarDataBR(dataIso) {
            const isoLimpo = normalizarDataParaIso(dataIso);
            const partes = isoLimpo.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return dataIso;
        }

        // Formatação inteligente para horas decimais do Excel (ex: 0.5 -> 12:00, 0.72916... -> 17:30)
        function formatarHora(valorHora) {
            if (valorHora === null || valorHora === undefined || valorHora === "") return "-";
            let strHora = String(valorHora).trim();
            if (strHora === "0" || strHora === "0.0" || strHora === "--") return "00:00";

            if (strHora.includes('T')) {
                const partesT = strHora.split('T');
                if (partesT[1] && partesT[1].substring(0, 5) !== "00:00") return partesT[1].substring(0, 5);
            }

            const num = Number(strHora);
            if (!isNaN(num) && num >= 0 && num <= 1) {
                const totalMinutos = Math.round(num * 24 * 60);
                const horas = Math.floor(totalMinutos / 60);
                const minutos = totalMinutos % 60;
                return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}`;
            }

            if (strHora.length >= 5) return strHora.substring(0, 5);
            return strHora;
        }

        function atualizarPainel() {
            const dataSelecionada = document.getElementById('filtro-data').value;
            const termoBusca = document.getElementById('busca-geral').value.toLowerCase();

            // Filtrar agendamentos que caem na data selecionada de forma exata
            const agendamentosDoDia = dadosGlobais.filter(item => {
                const dataItemIso = normalizarDataParaIso(item["Data"] || item["Date"] || item["Dia"]);
                return dataItemIso === dataSelecionada;
            });

            // Identificar quais veículos da frota oficial estão ocupados nesta data
            const veiculosOcupados = new Set();
            agendamentosDoDia.forEach(item => {
                const veiculoNome = normalizarTexto(item["Veículo"] || item["Veiculo"]);
                FROTA_OFICIAL.forEach(f => {
                    if (normalizarTexto(f) === veiculoNome) {
                        veiculosOcupados.add(f);
                    }
                });
            });

            // Renderizar Cards dos 3 Veículos
            const gridVeiculos = document.getElementById('grid-veiculos');
            gridVeiculos.innerHTML = '';

            FROTA_OFICIAL.forEach(veiculo => {
                const ocupado = veiculosOcupados.has(veiculo);
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border transition-all ${
                    ocupado ? 'bg-amber-50/60 border-amber-200' : 'bg-emerald-50/60 border-emerald-200'
                }`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-gray-800 text-base">${veiculo}</span>
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${
                            ocupado ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                        }">
                            ${ocupado ? 'Ocupado' : 'Disponível'}
                        </span>
                    </div>
                    <p class="text-xs text-gray-500">${ocupado ? 'Agendado para esta data' : 'Disponível para uso'}</p>
                `;
                gridVeiculos.appendChild(card);
            });

            // Filtrar tabela com base na busca geral
            const agendamentosFiltrados = agendamentosDoDia.filter(item => {
                const linhaStr = JSON.stringify(item).toLowerCase();
                return linhaStr.includes(termoBusca);
            });

            // Renderizar Tabela
            const tbody = document.getElementById('tabela-agendamentos');
            tbody.innerHTML = '';
            document.getElementById('contador-agendamentos').innerText = `${agendamentosFiltrados.length} agendamento(s) encontrado(s)`;

            if (agendamentosFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">Nenhum agendamento encontrado para esta data.</td></tr>`;
                return;
            }

            agendamentosFiltrados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition-colors";

                const horaInicio = formatarHora(item["Horário Início"] || item["Horario Inicio"] || item["Início"] || item["Inicio"]);
                const horaFim = formatarHora(item["Horário Fim"] || item["Horario Fim"] || item["Fim"]);
                const veiculoNome = item["Veículo"] || item["Veiculo"] || "-";
                const motoristaNome = item["Motorista/Solicitante"] || item["Motorista"] || item["Solicitante"] || "-";

                tr.innerHTML = `
                    <td class="py-4 px-6 text-gray-600">${formatarDataBR(item["Data"] || item["Date"])}</td>
                    <td class="py-4 px-6 font-semibold text-gray-900">${veiculoNome}</td>
                    <td class="py-4 px-6 text-gray-700">${motoristaNome}</td>
                    <td class="py-4 px-6 text-gray-600">${horaInicio}</td>
                    <td class="py-4 px-6 text-gray-600">${horaFim}</td>
                    <td class="py-4 px-6">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-50 text-green-700 border border-green-200">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Confirmado
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Eventos de filtro
        document.getElementById('filtro-data').addEventListener('change', atualizarPainel);
        document.getElementById('busca-geral').addEventListener('input', atualizarPainel);

        // Inicializar
        carregarDados();
        setInterval(carregarDados, 300000);
    </script>
</body>
</html>
